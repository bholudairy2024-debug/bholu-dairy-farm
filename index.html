<!-- REGISTRATION FORM -->

<form
  class="registration-form"
  id="registrationForm">

  <h3 style="margin-bottom:25px;">
    New Customer Registration
  </h3>

  <div class="form-row">

    <input
      type="text"
      id="customerName"
      placeholder="Full Name"
      required>

    <input
      type="tel"
      id="customerMobile"
      placeholder="Mobile Number"
      pattern="[0-9]{10}"
      maxlength="10"
      required>

  </div>

  <input
    type="text"
    id="customerAddress"
    placeholder="Complete Address"
    required>

  <div class="form-row">

    <select id="customerProduct" required>

      <option value="">
        Select Product
      </option>

      <option value="Cow Milk">
        Cow Milk
      </option>

      <option value="Buffalo Milk">
        Buffalo Milk
      </option>

      <option value="Desi Ghee">
        Desi Ghee
      </option>

    </select>

    <select id="customerQuantity" required>

      <option value="">
        Select Quantity
      </option>

      <option value="500 ml">
        500 ml
      </option>

      <option value="1 Litre">
        1 Litre
      </option>

      <option value="2 Litre">
        2 Litre
      </option>

      <option value="5 Litre">
        5 Litre
      </option>

    </select>

  </div>

  <textarea
    id="customerInfo"
    rows="4"
    placeholder="Additional Information (Optional)">
  </textarea>

  <button
    type="submit"
    class="submit-btn">

    Submit Registration

  </button>

</form>


<script>

/* MOBILE MENU */

function toggleMenu(){

  document
    .getElementById("navMenu")
    .classList.toggle("show");

}


/* OPEN REGISTRATION */

function openRegistration(){

  const form =
    document.getElementById(
      "registrationForm"
    );

  form.classList.add("show");

  setTimeout(function(){

    document
      .getElementById("registrationForm")
      .scrollIntoView({

        behavior:"smooth",
        block:"start"

      });

  },100);

}


/* CUSTOMER PORTAL */

function openCustomerPortal(){

  alert(
    "Customer Portal will be available soon."
  );

}


/* =========================================
   CUSTOMER REGISTRATION
   GOOGLE SHEET + EMAIL
========================================= */

const REGISTRATION_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbz6uMHqGrK4xWQOHG4nJval3BAfTyrQrUWnhUT6fyF7pLLF8EncR8LPCkAH966KyBVs/exec";


document
  .getElementById("registrationForm")
  .addEventListener(
    "submit",
    async function(event){

      event.preventDefault();

      const form = this;


      const name =
        document
          .getElementById("customerName")
          .value
          .trim();


      const mobile =
        document
          .getElementById("customerMobile")
          .value
          .trim();


      const address =
        document
          .getElementById("customerAddress")
          .value
          .trim();


      const product =
        document
          .getElementById("customerProduct")
          .value;


      const quantity =
        document
          .getElementById("customerQuantity")
          .value;


      const additionalInfo =
        document
          .getElementById("customerInfo")
          .value
          .trim();


      /* MOBILE VALIDATION */

      if(!/^[0-9]{10}$/.test(mobile)){

        alert(
          "Please enter a valid 10-digit mobile number."
        );

        return;

      }


      /* BUTTON */

      const submitButton =
        form.querySelector(".submit-btn");


      submitButton.disabled = true;

      submitButton.textContent =
        "Submitting...";


      /* DATA */

      const data = {

        name: name,

        mobile: mobile,

        address: address,

        product: product,

        quantity: quantity,

        additionalInfo: additionalInfo

      };


      /* SEND TO GOOGLE APPS SCRIPT */

      try{

        await fetch(

          REGISTRATION_SCRIPT_URL,

          {

            method: "POST",

            mode: "no-cors",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body:
              JSON.stringify(data)

          }

        );


        /* SUCCESS */

        alert(
          "✅ Registration submitted successfully!\n\n" +
          "Thank you for registering with Bholu Dairy Farm. " +
          "Our team will contact you shortly."
        );


        form.reset();

        form.classList.remove("show");


      }catch(error){

        console.error(error);

        alert(
          "Registration could not be submitted. " +
          "Please try again."
        );

      }


      submitButton.disabled = false;

      submitButton.textContent =
        "Submit Registration";

    }

  );

</script>
